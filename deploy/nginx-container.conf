server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    include /etc/nginx/snippets/codigos-secretos-security.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        image/svg+xml
        text/css
        text/plain;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite genera nombres con hash dentro de /assets/. Se pueden conservar en
    # caché un año porque cada cambio produce una URL nueva.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        # Los add_header definidos en un location sustituyen los heredados.
        # Se incluye de nuevo la política para conservarla junto al caché.
        include /etc/nginx/snippets/codigos-secretos-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        include /etc/nginx/snippets/codigos-secretos-security.conf;
        add_header Cache-Control "no-store";
    }

    # El proyecto usa HashRouter, pero el fallback también protege el acceso a
    # cualquier archivo/ruta que el proxy del cliente reenvíe al contenedor.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/codigos-secretos-security.conf;
        add_header Cache-Control "no-cache";
    }
}
