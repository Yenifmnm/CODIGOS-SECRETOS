# Publica el microsite en GitHub Pages en cada push a main.
#
# No hace falta configurar `base` ni reglas de rewrite: el proyecto usa rutas
# relativas (`base: './'`) y HashRouter, así que funciona igual en la raíz del
# dominio que bajo el subpath /<repo>/ que asigna Pages.

name: Publicar microsite

# DESACTIVADO: el disparo por push está comentado mientras se calibran las
# pantallas mobile contra el Figma. Se publica a mano desde la pestaña Actions
# («Run workflow») y se vuelve a activar descomentando estas dos líneas.
on:
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue por vez; si se encolan varios, gana el último.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Falla el build si hay errores de tipos, antes de publicar nada.
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
